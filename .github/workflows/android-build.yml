name: Android Build

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build type: debug or release'
        required: true
        type: string
      version_name:
        description: 'Version name for the build'
        required: false
        type: string
      upload_artifacts:
        description: 'Whether to upload built artifacts'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create github.properties file
        run: |
          touch github.properties
          echo gpr.usr=${{ secrets.GPR_USER }} >> github.properties
          echo gpr.key=${{ secrets.GPR_API_KEY }} >> github.properties
          cat github.properties

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report directory
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/reports/tests/testDebugUnitTest/

      - name: Run lint
        run: ./gradlew lint

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: LintResult
          path: build/reports/lint-results*.html

      - name: Build with Gradle
        run: |
          BUILD_TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${INPUT_BUILD_TYPE:0:1})${INPUT_BUILD_TYPE:1}"
          if [ -n "${{ inputs.version_name }}" ]; then
            ./gradlew -PverName=${{ inputs.version_name }} clean assemble${BUILD_TYPE_CAP}
          else
            ./gradlew clean assemble${BUILD_TYPE_CAP}
          fi
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
      - name: Set App name
        run: |
          APP_NAME=$(basename $(ls build/outputs/aar/*${{ inputs.build_type }}.aar | head -n 1))
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Upload package
        if: ${{ inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: build/outputs/aar/${{ env.APP_NAME }}
