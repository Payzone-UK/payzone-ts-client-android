name: Android CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - 'test/**'
      - main
      - master

jobs:

  # ── Runs on every trigger: PR to develop, push to test/**, main, master ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create github.properties
        run: |
          touch github.properties
          echo gpr.usr=${{ secrets.GPR_USER }} >> github.properties
          echo gpr.key=${{ secrets.GPR_API_KEY }} >> github.properties

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: TestResults
          path: build/reports/tests/testDebugUnitTest/

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: CoverageReport
          path: build/reports/jacoco/jacocoTestReport/html/

      - name: Run lint
        run: ./gradlew lint

      - name: Upload lint report
        uses: actions/upload-artifact@v3
        with:
          name: LintResult
          path: build/reports/lint-results*.html

  # ── Only on push to test/** — builds a debug AAR for QA ──
  build_test_candidate:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/test/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create github.properties
        run: |
          touch github.properties
          echo gpr.usr=${{ secrets.GPR_USER }} >> github.properties
          echo gpr.key=${{ secrets.GPR_API_KEY }} >> github.properties

      - name: Get branch name
        id: extract_branch
        run: echo "branch=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT

      - name: Build AAR
        run: ./gradlew -PverName=${{ steps.extract_branch.outputs.branch }} clean build

      - name: Set app name
        run: echo "APP_NAME=$(basename $(ls build/outputs/aar/*debug.aar | head -n 1))" >> $GITHUB_ENV

      - name: Upload AAR
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.APP_NAME }}
          path: build/outputs/aar/${{ env.APP_NAME }}

  # ── Only on push to main/master — creates a GitHub release and publishes ──
  publish_release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create github.properties
        run: |
          touch github.properties
          echo gpr.usr=${{ secrets.GPR_USER }} >> github.properties
          echo gpr.key=${{ secrets.GPR_API_KEY }} >> github.properties

      - name: Retrieve version name
        id: app_version
        run: echo "VERSION_NAME=$(./gradlew -q versionName)" >> $GITHUB_OUTPUT

      - name: Build AAR
        run: ./gradlew build

      - name: Set app name
        run: echo "APP_NAME=$(basename $(ls build/outputs/aar/*release.aar | head -n 1))" >> $GITHUB_ENV

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v.${{ steps.app_version.outputs.VERSION_NAME }}
          release_name: Release ${{ steps.app_version.outputs.VERSION_NAME }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/outputs/aar/${{ env.APP_NAME }}
          asset_name: ${{ env.APP_NAME }}
          asset_content_type: application/zip

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish
